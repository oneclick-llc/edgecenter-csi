name: Publish EdgeCenter CSI to GHCR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-ghcr.yaml
      - Dockerfile
      - cmd/**
      - go.mod
      - go.sum
      - pkg/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/oneclick-llc/edgecenter-csi:csi-${{ github.sha }}
            ghcr.io/oneclick-llc/edgecenter-csi:latest
          labels: |
            org.opencontainers.image.source=https://github.com/oneclick-llc/edgecenter-csi
