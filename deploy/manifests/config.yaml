apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-ec-plugin-config
  namespace: kube-system
data:
  CLUSTER_ID: "__K8S_CLUSTER_ID__"
---
apiVersion: v1
kind: Secret
metadata:
  name: csi-ec-plugin-config
  namespace: kube-system
type: Opaque
stringData:
  config.yaml: |
    apiUrl: https://api.edgecenter.ru/cloud
    projectID: __PROJECT_ID__
    apiToken: __API_TOKEN__
    regions:
      - name: moscow
        regionID: 10
        topology: moscow
      - name: moscow-2
        regionID: 112
        topology: moscow-2
      - name: moscow-3
        regionID: 116
        topology: moscow-3
